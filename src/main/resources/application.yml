spring:
  profiles:
    active: dev

  application:
    name: ms-vehiculos

  jpa:
    # Los services devuelven DTO dentro de la transacción: no se necesita open-in-view
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Pool de conexiones: HTTP, outbox y consumidor SQS comparten 8
  datasource:
    hikari:
      maximum-pool-size: 8

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Convención del DAS general: JSON en snake_case, fechas ISO 8601 en GMT-5
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: America/Bogota

  # Timeout de 2 s para las llamadas a Documentación y Asignaciones
  http:
    client:
      connect-timeout: 2s
      read-timeout: 2s

server:
  port: 8085
  # t3.micro (1 GB): menos hilos que los 200 por defecto
  tomcat:
    threads:
      max: 50
      min-spare: 5

fleetops:
  services:
    documents:
      url: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
    assignments:
      url: ${ASSIGNMENTS_SERVICE_URL:http://localhost:8082}
  # Mensajería SNS/SQS (HU-13). Sin topic o sin cola configurados, esa parte no arranca.
  # Credenciales: cadena por defecto del SDK (rol del EC2 en AWS; AWS_ACCESS_KEY_ID y
  # AWS_SECRET_ACCESS_KEY del entorno en local con LocalStack). El código no lleva claves.
  messaging:
    enabled: ${FLEETOPS_MESSAGING_ENABLED:true}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${FLEETOPS_MESSAGING_ENDPOINT:}
    topic-arn: ${SNS_TOPIC_ARN:}
    queue-url: ${SQS_QUEUE_URL:}
    publisher:
      batch-size: 50
      fixed-delay-ms: 2000
      timeout-ms: 2000
    listener:
      wait-time-seconds: 20
      max-messages: 10
      error-backoff-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

# Endpoints transversales del catálogo: GET /health, GET /ready y GET /metrics
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
          additional-path: server:/ready
