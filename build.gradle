plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '7.3.0.8198'
}

group = 'co.edu.univalle'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    // Métricas para Prometheus (GET /metrics)
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── JaCoCo ────────────────────────────────────────────────────────────────
// Global (80 %): todo el código salvo el arranque y la configuración de Spring.
// Dominio y aplicación (100 % de líneas y ramas): ver segunda regla.

def jacocoExclusions = [
    'co/edu/univalle/fleetops/vehicles/infrastructure/config/**',
    // Clientes de G1/G2 pendientes: se miden cuando el equipo los implemente
    'co/edu/univalle/fleetops/vehicles/infrastructure/client/**',
    'co/edu/univalle/fleetops/vehicles/VehiclesApplication.class'
]

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
        csv.required.set(true)
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir('jacocoHtml'))
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
        rule {
            element = 'CLASS'
            includes = [
                'co.edu.univalle.fleetops.vehicles.domain.*',
                'co.edu.univalle.fleetops.vehicles.application.*'
            ]
            limit {
                counter = 'LINE'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.0
            }
        }
    }
}

// ── Checkstyle ────────────────────────────────────────────────────────────

checkstyle {
    toolVersion = '10.21.4'
    configFile = file('checkstyle.xml')
    ignoreFailures = false
    showViolations = true
}

// ── SonarCloud ────────────────────────────────────────────────────────────
// Reemplazar TU-ORGANIZACION por la organización creada en sonarcloud.io (Paso 15.3)

sonar {
    properties {
        property 'sonar.projectKey', 'TU-ORGANIZACION_ms-vehiculos'
        property 'sonar.organization', 'TU-ORGANIZACION'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.coverage.exclusions',
                 '**/config/**,**/model/**,**/dto/**,**/exception/**,**/controller/**,**/client/**'
        property 'sonar.java.source', '21'
    }
}

// ── Orden de tareas ───────────────────────────────────────────────────────

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

check {
    dependsOn jacocoTestCoverageVerification
}
