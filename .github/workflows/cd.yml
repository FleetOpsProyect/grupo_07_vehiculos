name: CD — Despliegue Continuo

# Se dispara cuando el PR dev → main se fusiona (un merge es un push a main).
# Con "pull_request" desplegaría al abrir el PR, antes de aprobarlo.
on:
  push:
    branches:
      - main

jobs:
  cd:
    name: Build, Push y Despliegue en EC2
    runs-on: ubuntu-latest
    steps:

      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # El Dockerfile compila el JAR en su primera etapa (multi-stage): no hace falta Gradle aquí.
      # Solo se publica el tag con el SHA del commit; nunca "latest".
      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ms-vehiculos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Se copian en cada despliegue para que el EC2 siempre tenga el compose y el script vigentes
      - name: Copiar archivos de despliegue al EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/deploy.sh"
          target: "app"
          strip_components: 0

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd ~/app
            mv -f deploy/deploy.sh deploy.sh
            chmod +x deploy.sh
            ./deploy.sh "$IMAGE_TAG"
