spring:
  profiles:
    active: dev
  application:
    name: ms-vehiculos

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:3050/vehiculos_db}
    username: ${SPRING_DATASOURCE_USERNAME:vehiculos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vehiculos_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: America/Bogota

  http:
    client:
      connect-timeout: 2s
      read-timeout: 2s

server:
  port: 8085

fleetops:
  services:
    documents:
      url: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
    assignments:
      url: ${ASSIGNMENTS_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
          additional-path: server:/ready